name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing (OIDC) and provenance attestation.
  # This is what lets us publish without storing a long-lived NPM_TOKEN.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # npm 11.5+ is required for trusted publishing.
      - run: npm install -g npm@latest

      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          # Two gates: merging a feature PR only queues a release by opening
          # the version PR; merging that PR is what actually publishes.
          version: pnpm version
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
